[package]
name = "pinch-keymap"
version = "0.1.0"
edition = "2024"
description = "Ask the operating system what each key on the keyboard prints"
repository = "https://github.com/agourlay/pinch-points"
license = "Apache-2.0"
keywords = ["keyboard", "keymap", "layout", "azerty", "qwertz"]
categories = ["os", "game-development"]

[lints]
workspace = true

# The pure-Rust connection: the core X11 protocol answers this without
# libxkbcommon to link, a dev package to install, or a line of unsafe.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
